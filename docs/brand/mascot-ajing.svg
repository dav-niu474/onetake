<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 580" width="520" height="580">
  <defs>
    <radialGradient id="halo" cx="0.5" cy="0.48" r="0.55">
      <stop offset="0" stop-color="#F59E0B" stop-opacity="0.20"/>
      <stop offset="0.65" stop-color="#F59E0B" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBAD4A"/>
      <stop offset="1" stop-color="#F08C1F"/>
    </linearGradient>
    <linearGradient id="boardG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A2233"/>
      <stop offset="1" stop-color="#111826"/>
    </linearGradient>
    <linearGradient id="beretG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#252E44"/>
      <stop offset="1" stop-color="#161D2E"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- ================= background ================= -->
  <rect width="520" height="580" rx="28" fill="#0B0E14"/>
  <circle cx="262" cy="300" r="252" fill="url(#halo)"/>

  <!-- faint canvas nodes -->
  <g stroke="#F59E0B" stroke-width="2" fill="none" opacity="0.15">
    <path d="M 52 96 C 110 120, 96 60, 150 58"/>
    <path d="M 468 448 C 430 420, 452 380, 494 372"/>
    <path d="M 40 430 C 80 440, 70 490, 34 500"/>
  </g>
  <g fill="#F59E0B" opacity="0.28">
    <rect x="145" y="52" width="10" height="10" rx="3"/>
    <rect x="490" y="367" width="10" height="10" rx="3"/>
    <rect x="28" y="495" width="10" height="10" rx="3"/>
    <circle cx="52" cy="96" r="4"/>
    <circle cx="468" cy="448" r="4"/>
    <circle cx="40" cy="430" r="3.4"/>
  </g>
  <text x="262" y="558" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" letter-spacing="6" fill="#8B93A5">一镜到底 · 一条过</text>

  <!-- ================= tail with cable plug ================= -->
  <g>
    <path d="M 332 448 C 418 452, 452 402, 436 342 C 424 296, 372 284, 356 318"
          fill="none" stroke="#E88518" stroke-width="21" stroke-linecap="round"/>
    <path d="M 332 448 C 418 452, 452 402, 436 342"
          fill="none" stroke="#F9AD4B" stroke-width="7" stroke-linecap="round" opacity="0.55"/>
    <!-- plug -->
    <g transform="translate(438,332) rotate(38)">
      <rect x="-11" y="-4" width="22" height="30" rx="6" fill="#232B3D" stroke="#3A4560" stroke-width="2"/>
      <rect x="-7" y="-24" width="14" height="22" rx="4" fill="#9CA7BC"/>
      <rect x="-4" y="-31" width="8" height="8" rx="2" fill="#C7D0E0"/>
      <circle cx="0" cy="18" r="3.4" fill="#F59E0B"/>
    </g>
  </g>

  <!-- ================= body ================= -->
  <!-- resting right arm -->
  <path d="M 330 415 Q 352 448 350 470" fill="none" stroke="#E88518" stroke-width="35" stroke-linecap="round"/>
  <ellipse cx="350" cy="478" rx="24" ry="19" fill="#FBAD4A"/>

  <ellipse cx="262" cy="432" rx="99" ry="88" fill="url(#fur)"/>
  <!-- side stripes -->
  <rect x="176" y="404" width="24" height="74" rx="12" fill="#DD7913" opacity="0.85" transform="rotate(9 188 441)"/>
  <rect x="322" y="404" width="24" height="74" rx="12" fill="#DD7913" opacity="0.85" transform="rotate(-9 334 441)"/>
  <!-- belly -->
  <ellipse cx="262" cy="452" rx="56" ry="52" fill="#FFE9CB"/>
  <!-- hind feet -->
  <ellipse cx="212" cy="508" rx="34" ry="21" fill="#F9A23B"/>
  <ellipse cx="312" cy="508" rx="34" ry="21" fill="#F9A23B"/>
  <ellipse cx="212" cy="511" rx="20" ry="11" fill="#FFE9CB"/>
  <ellipse cx="312" cy="511" rx="20" ry="11" fill="#FFE9CB"/>

  <!-- ================= raised arm + clapperboard ================= -->
  <path d="M 196 408 Q 160 386 150 348" fill="none" stroke="#E88518" stroke-width="35" stroke-linecap="round"/>
  <g transform="translate(148,296) rotate(-13)">
    <!-- board -->
    <rect x="-62" y="-16" width="124" height="88" rx="11" fill="url(#boardG)" stroke="#32405E" stroke-width="2.5"/>
    <!-- clapper stripes -->
    <g transform="translate(0,-16)">
      <rect x="-62" y="-26" width="124" height="27" rx="8" fill="url(#boardG)" stroke="#32405E" stroke-width="2.5"/>
      <g fill="#F59E0B">
        <path d="M -50 -26 l 16 0 l -12 27 l -16 0 Z"/>
        <path d="M -14 -26 l 16 0 l -12 27 l -16 0 Z"/>
        <path d="M 22 -26 l 16 0 l -12 27 l -16 0 Z"/>
        <path d="M 58 -26 l 12 0 l 0 27 l -24 0 Z" opacity="0.9"/>
      </g>
      <circle cx="-56" cy="-12.5" r="4.5" fill="#32405E"/>
    </g>
    <text x="0" y="34" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700" font-size="30" letter-spacing="6" fill="#F8FAFC">一镜</text>
    <text x="0" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="14" letter-spacing="4" fill="#F59E0B">ONE TAKE</text>
  </g>
  <!-- paw on board edge -->
  <circle cx="146" cy="326" r="21" fill="#FBAD4A"/>

  <!-- ================= head ================= -->
  <!-- ears -->
  <path d="M 156 142 L 174 52 L 240 106 Z" fill="#F59A3C"/>
  <path d="M 168 128 L 180 76 L 220 108 Z" fill="#FDBA74"/>
  <path d="M 364 142 L 346 52 L 280 106 Z" fill="#F59A3C"/>
  <path d="M 352 128 L 340 76 L 300 108 Z" fill="#FDBA74"/>

  <!-- face -->
  <ellipse cx="260" cy="216" rx="122" ry="104" fill="url(#fur)"/>

  <!-- forehead stripes -->
  <g fill="#DD7913" opacity="0.9">
    <rect x="226" y="122" width="13" height="36" rx="6.5"/>
    <rect x="254" y="118" width="13" height="40" rx="6.5"/>
    <rect x="282" y="122" width="13" height="36" rx="6.5"/>
  </g>

  <!-- aperture eyes -->
  <g>
    <circle cx="214" cy="212" r="28" fill="#241408" stroke="#F59E0B" stroke-width="3.5"/>
    <circle cx="206" cy="203" r="9" fill="#FFFFFF" opacity="0.96"/>
    <circle cx="223" cy="222" r="4.6" fill="#FFD9A8" opacity="0.85"/>
    <circle cx="306" cy="212" r="28" fill="#241408" stroke="#F59E0B" stroke-width="3.5"/>
    <circle cx="298" cy="203" r="9" fill="#FFFFFF" opacity="0.96"/>
    <circle cx="315" cy="222" r="4.6" fill="#FFD9A8" opacity="0.85"/>
  </g>

  <!-- blush -->
  <ellipse cx="163" cy="258" rx="21" ry="12" fill="#FB923C" opacity="0.55"/>
  <ellipse cx="357" cy="258" rx="21" ry="12" fill="#FB923C" opacity="0.55"/>

  <!-- nose + mouth -->
  <path d="M 249 246 q 11 -7 22 0 q -11 15 -22 0 Z" fill="#E4571B"/>
  <path d="M 260 254 q -2 13 -15 13 M 260 254 q 2 13 15 13" fill="none" stroke="#7C2D12" stroke-width="3.6" stroke-linecap="round"/>

  <!-- whiskers -->
  <g stroke="#FFE1B8" stroke-width="2.6" stroke-linecap="round" opacity="0.85">
    <line x1="152" y1="240" x2="96" y2="231"/>
    <line x1="152" y1="254" x2="96" y2="255"/>
    <line x1="153" y1="268" x2="101" y2="277"/>
    <line x1="368" y1="240" x2="424" y2="231"/>
    <line x1="368" y1="254" x2="424" y2="255"/>
    <line x1="367" y1="268" x2="419" y2="277"/>
  </g>

  <!-- beret -->
  <g transform="rotate(-9 260 96)">
    <ellipse cx="260" cy="98" rx="94" ry="33" fill="url(#beretG)"/>
    <ellipse cx="262" cy="82" rx="66" ry="24" fill="#2B3550"/>
    <circle cx="262" cy="58" r="7" fill="#1A2233"/>
    <circle cx="188" cy="104" r="6" fill="#F59E0B" opacity="0.95"/>
  </g>

  <!-- glow accents -->
  <g filter="url(#soft)" opacity="0.5">
    <circle cx="148" cy="296" r="8" fill="#F59E0B"/>
  </g>
</svg>
